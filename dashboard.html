<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tableau de bord opérateur — Trajets en direct</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0b1f3a" />
<link rel="stylesheet" href="/leaflet.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="/leaflet.css" /></noscript>
<style>
  :root { --navy:#0b1f3a; --blue:#1e5ab8; --gold:#d4a72c; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; color:var(--navy); }
  header { background:var(--navy); color:#fff; padding:0.9rem 1.2rem; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:1.05rem; }
  #layout { display:flex; height: calc(100vh - 56px); }
  #map { flex:1; }
  #sidebar { width: 300px; border-left:1px solid #e3e7ee; overflow-y:auto; background:#fafbfd; }
  .trip-item { padding:0.8rem 1rem; border-bottom:1px solid #eee; font-size:0.85rem; }
  .trip-item strong { display:block; color:var(--navy); }
  .trip-item .meta { color:#5a6475; font-size:0.78rem; margin-top:0.2rem; }
  .trip-item .route { font-size:0.8rem; margin-top:0.35rem; color:var(--navy); }
  .trip-item .route b { color:var(--blue); }
  .popup-table { font-size:0.8rem; line-height:1.5; }
  .popup-table td:first-child { color:#5a6475; padding-right:0.6rem; vertical-align:top; }
  .empty { padding:1rem; color:#5a6475; font-size:0.9rem; }
  .pill { background:var(--gold); color:#3a2c00; border-radius:999px; padding:0.1rem 0.5rem; font-size:0.7rem; }
  #soundBtn { background:#fff; border:1px solid #c7d2e8; color:var(--navy); border-radius:999px; padding:0.25rem 0.7rem; font-size:0.75rem; cursor:pointer; margin-right:0.5rem; }
  #soundBtn.on { background:#17643a; color:#fff; border-color:#17643a; }
  .trip-item.alert { background:#fdecec; border-left:4px solid #b8341e; }
  @keyframes pulseAlert { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
  .trip-item.alert .alertLabel { color:#8a1f1f; font-weight:700; animation: pulseAlert 1.3s infinite; display:block; margin-bottom:0.2rem; }
  .clearAlertBtn { margin-top:0.4rem; background:#8a1f1f; color:#fff; border:none; border-radius:6px; padding:0.3rem 0.6rem; font-size:0.75rem; cursor:pointer; }
  #pushBtn { background:#fff; border:1px solid #c7d2e8; color:var(--navy); border-radius:999px; padding:0.25rem 0.7rem; font-size:0.75rem; cursor:pointer; margin-right:0.5rem; }
  #pushBtn.on { background:#1e5ab8; color:#fff; border-color:#1e5ab8; }
  .trip-item.signalLost { background:#fff6e5; border-left:4px solid #b8860b; }
  .trip-item.signalLost .signalLabel { color:#8a5a00; font-weight:700; display:block; margin-bottom:0.2rem; }
  .vehicleWarning { color:#b8860b; font-weight:600; }
</style>
</head>
<body style="background:#f4f6fa; margin:0;">
<script>
// Diagnostic visible : affiche toute erreur JS ou tout échec de
// chargement de ressource directement à l'écran plutôt que dans une
// console inaccessible sur téléphone.
(function () {
  var box = document.createElement('div');
  box.id = 'diagBox';
  box.style.cssText = 'display:none; position:sticky; top:0; z-index:9999; background:#b8341e; color:#fff; font:12px/1.4 monospace; padding:0.6rem 0.8rem; white-space:pre-wrap; word-break:break-word;';
  document.addEventListener('DOMContentLoaded', function () {
    document.body.insertBefore(box, document.body.firstChild);
  });
  function show(label, detail) {
    box.style.display = 'block';
    box.textContent += (box.textContent ? '\n' : '') + '[' + label + '] ' + detail;
  }
  window.addEventListener('error', function (e) {
    if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
      show('Ressource non chargée', (e.target.src || e.target.href || '?'));
    } else {
      show('Erreur JS', e.message + ' (' + (e.filename || '?') + ':' + e.lineno + ')');
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('Promesse rejetée', (e.reason && e.reason.message) || String(e.reason));
  });
})();
</script>
<header>
  <h1>Safetrip — Trajets voyageurs en direct</h1>
  <div>
    <button id="pushBtn">🔔 Activer les notifications</button>
    <button id="soundBtn">🔈 Activer le son d'alerte</button>
    <span class="pill" id="countPill">0 trajet actif</span>
  </div>
</header>
<div id="layout">
  <div id="map"></div>
  <div id="sidebar"><div class="empty">En attente de trajets actifs…</div></div>
</div>

<script src="/leaflet.js"></script>
<script>
  // Les images d'icônes Leaflet sont à la racine du site (pas de sous-dossier) :
  // on l'indique explicitement pour que les marqueurs s'affichent correctement.
  if (typeof L !== 'undefined') {
    delete L.Icon.Default.prototype._getIconUrl;
    L.Icon.Default.mergeOptions({
      iconRetinaUrl: '/marker-icon-2x.png',
      iconUrl: '/marker-icon.png',
      shadowUrl: '/marker-shadow.png',
    });
  }
</script>
<script src="/socket.io/socket.io.js"></script>
<script>
// Jeton injecté par le serveur quand cette page est servie avec succès
// (après authentification Basic si un mot de passe opérateur est configuré).
// Vide/placeholder si le fichier est ouvert autrement qu'via le serveur.
const OPERATOR_TOKEN = '__OPERATOR_TOKEN__';

let map = null;
try {
  if (typeof L === 'undefined') throw new Error('Leaflet non chargé');
  map = L.map('map').setView([3.848, 11.502], 7); // Yaoundé par défaut
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
} catch (e) {
  // La carte n'a pas pu se charger (réseau lent/instable) : la liste
  // latérale continue de fonctionner normalement sans elle.
  document.getElementById('map').innerHTML =
    '<div style="padding:1rem; color:#5a6475; font-size:0.9rem;">' +
    'Carte indisponible (connexion lente ?) — la liste des trajets ci-contre reste à jour.</div>';
}

const markers = {};        // tripId -> L.marker
const alertCircles = {};   // tripId -> L.circle (halo rouge autour du marqueur en alerte)
const tripInfo = {};       // tripId -> {displayName, lineLabel, lastSeen, alertActive, lastAlertAt}
const sidebar = document.getElementById('sidebar');
const countPill = document.getElementById('countPill');
const soundBtn = document.getElementById('soundBtn');

// --- Son d'alerte --------------------------------------------------------
// Les navigateurs bloquent tout son avant un premier geste de l'utilisateur :
// l'opérateur doit cliquer une fois sur "Activer le son" pour le débloquer.
let audioCtx = null;
let soundEnabled = false;
soundBtn.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  soundEnabled = !soundEnabled;
  soundBtn.classList.toggle('on', soundEnabled);
  soundBtn.textContent = soundEnabled ? '🔊 Son activé' : '🔈 Activer le son d\'alerte';
  if (soundEnabled) playAlertSound();
});

// --- Notifications push ---------------------------------------------------
// Permet d'être alerté même dashboard fermé ou téléphone verrouillé, à
// condition d'avoir installé la page ("Ajouter à l'écran d'accueil") —
// requis par iOS/Safari (16.4+) pour autoriser les notifications web du
// tout ; Android/Chrome les autorise aussi depuis un simple onglet.
const pushBtn = document.getElementById('pushBtn');
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    pushBtn.style.display = 'none';
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      pushBtn.classList.add('on');
      pushBtn.textContent = '🔔 Notifications activées';
    }
  } catch (e) {
    pushBtn.style.display = 'none';
  }
}
initPush();

pushBtn.addEventListener('click', async () => {
  try {
    const { enabled, publicKey } = await (await fetch('/api/push/public-key')).json();
    if (!enabled) {
      alert("Les notifications push ne sont pas configurées sur ce serveur pour l'instant.");
      return;
    }
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub),
    });
    pushBtn.classList.add('on');
    pushBtn.textContent = '🔔 Notifications activées';
  } catch (e) {
    alert("Impossible d'activer les notifications sur cet appareil/navigateur.");
  }
});

function playAlertSound() {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  [0, 0.35].forEach((offset) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, now + offset);
    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.3);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.3);
  });
}

function renderSidebar() {
  const ids = Object.keys(tripInfo).sort((a, b) => (tripInfo[b].alertActive ? 1 : 0) - (tripInfo[a].alertActive ? 1 : 0));
  countPill.textContent = `${ids.length} trajet${ids.length > 1 ? 's' : ''} actif${ids.length > 1 ? 's' : ''}`;
  if (ids.length === 0) {
    sidebar.innerHTML = '<div class="empty">En attente de trajets actifs…</div>';
    return;
  }
  sidebar.innerHTML = ids.map((id) => {
    const t = tripInfo[id];
    const fare = t.fareAmount != null ? `${t.fareAmount.toLocaleString('fr-FR')} ${t.fareCurrency || ''}` : null;
    const cls = t.alertActive ? ' alert' : (t.signalLost ? ' signalLost' : '');
    return `<div class="trip-item${cls}">
      ${t.alertActive ? `<span class="alertLabel">🆘 ALERTE — ${new Date(t.lastAlertAt).toLocaleTimeString('fr-FR')}</span>` : ''}
      ${!t.alertActive && t.signalLost ? `<span class="signalLabel">⚠️ Signal perdu depuis ${t.signalLostMinutes || '?'} min</span>` : ''}
      <strong>${escapeHtml(t.displayName)}</strong>
      <div class="meta">${escapeHtml(t.transportMode || 'Transport non précisé')}${t.agencyName ? ' · ' + escapeHtml(t.agencyName) : ''}</div>
      <div class="route"><b>${escapeHtml(t.originLabel || '?')}</b> → <b>${escapeHtml(t.destinationLabel || '?')}</b></div>
      ${fare ? `<div class="meta">Coût payé : ${fare}</div>` : ''}
      ${t.vehiclePlate ? `<div class="meta">Véhicule : ${escapeHtml(t.vehiclePlate)}${t.seatNumber ? ' · siège ' + escapeHtml(t.seatNumber) : ''}</div>` : ''}
      ${t.vehicleAlertCount > 0 ? `<div class="meta vehicleWarning">⚠️ Ce véhicule a ${t.vehicleAlertCount} alerte(s) antérieure(s)</div>` : ''}
      <div class="meta">Vu à ${new Date(t.lastSeen).toLocaleTimeString('fr-FR')}</div>
      ${t.alertActive ? `<button class="clearAlertBtn" data-trip="${id}">Marquer comme traité</button>` : ''}
    </div>`;
  }).join('');

  sidebar.querySelectorAll('.clearAlertBtn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      await fetch(`/api/trips/${btn.dataset.trip}/alert/clear`, { method: 'POST' });
    });
  });
}

function setAlertCircle(tripId, lat, lng, active) {
  if (!map) return;
  if (active) {
    if (alertCircles[tripId]) {
      alertCircles[tripId].setLatLng([lat, lng]);
    } else {
      alertCircles[tripId] = L.circle([lat, lng], {
        radius: 60, color: '#b8341e', weight: 3, fillColor: '#b8341e', fillOpacity: 0.25,
      }).addTo(map);
    }
  } else if (alertCircles[tripId]) {
    map.removeLayer(alertCircles[tripId]);
    delete alertCircles[tripId];
  }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

const socket = io();
socket.on('connect', () => socket.emit('dashboard:join', { token: OPERATOR_TOKEN }));
socket.on('dashboard:unauthorized', () => {
  document.body.innerHTML = '<div style="padding:2rem; font-family:sans-serif; color:#8a1f1f;">' +
    'Session expirée ou non autorisée. Rechargez la page (Ctrl+F5) et ressaisissez le mot de passe opérateur si demandé.</div>';
});

socket.on('position:broadcast', (msg) => {
  const {
    tripId, travelerDisplayName, lineLabel, transportMode, agencyName,
    originLabel, destinationLabel, fareAmount, fareCurrency,
    vehiclePlate, seatNumber, scheduledDepartureAt, notes,
    lat, lng, recordedAt, alertActive, lastAlertAt, vehicleAlertCount,
  } = msg;

  tripInfo[tripId] = {
    displayName: travelerDisplayName, lineLabel, transportMode, agencyName,
    originLabel, destinationLabel, fareAmount, fareCurrency,
    vehiclePlate, seatNumber, scheduledDepartureAt, notes,
    lastSeen: recordedAt,
    alertActive: !!alertActive,
    lastAlertAt: lastAlertAt || (tripInfo[tripId] && tripInfo[tripId].lastAlertAt) || null,
    vehicleAlertCount: vehicleAlertCount || 0,
    signalLost: false,
  };
  setAlertCircle(tripId, lat, lng, !!alertActive);

  const popupHtml = `
    <strong>${escapeHtml(travelerDisplayName)}</strong>
    <table class="popup-table">
      <tr><td>Transport</td><td>${escapeHtml(transportMode || '—')}${agencyName ? ' (' + escapeHtml(agencyName) + ')' : ''}</td></tr>
      <tr><td>Trajet</td><td>${escapeHtml(originLabel || '?')} → ${escapeHtml(destinationLabel || '?')}</td></tr>
      ${fareAmount != null ? `<tr><td>Coût payé</td><td>${Number(fareAmount).toLocaleString('fr-FR')} ${escapeHtml(fareCurrency || '')}</td></tr>` : ''}
      ${vehiclePlate ? `<tr><td>Véhicule</td><td>${escapeHtml(vehiclePlate)}${seatNumber ? ' · siège ' + escapeHtml(seatNumber) : ''}</td></tr>` : ''}
      ${scheduledDepartureAt ? `<tr><td>Départ prévu</td><td>${new Date(scheduledDepartureAt).toLocaleString('fr-FR')}</td></tr>` : ''}
      ${notes ? `<tr><td>Notes</td><td>${escapeHtml(notes)}</td></tr>` : ''}
    </table>`;

  if (map) {
    if (markers[tripId]) {
      markers[tripId].setLatLng([lat, lng]);
      markers[tripId].setPopupContent(popupHtml);
    } else {
      markers[tripId] = L.marker([lat, lng]).addTo(map).bindPopup(popupHtml);
    }
  }
  renderSidebar();
});

socket.on('trip:alert', ({ tripId, travelerDisplayName, lat, lng, at }) => {
  if (!tripInfo[tripId]) {
    tripInfo[tripId] = { displayName: travelerDisplayName, lastSeen: at };
  }
  tripInfo[tripId].alertActive = true;
  tripInfo[tripId].lastAlertAt = at;
  if (lat != null && lng != null) setAlertCircle(tripId, lat, lng, true);
  else if (markers[tripId]) {
    const ll = markers[tripId].getLatLng();
    setAlertCircle(tripId, ll.lat, ll.lng, true);
  }
  playAlertSound();
  renderSidebar();
});

socket.on('trip:alert:cleared', ({ tripId }) => {
  if (tripInfo[tripId]) tripInfo[tripId].alertActive = false;
  setAlertCircle(tripId, 0, 0, false);
  renderSidebar();
});

socket.on('trip:signal_lost', ({ tripId, travelerDisplayName, silentForMinutes }) => {
  if (!tripInfo[tripId]) tripInfo[tripId] = { displayName: travelerDisplayName, lastSeen: Date.now() };
  tripInfo[tripId].signalLost = true;
  tripInfo[tripId].signalLostMinutes = silentForMinutes;
  playAlertSound();
  renderSidebar();
});

socket.on('trip:signal_restored', ({ tripId }) => {
  if (tripInfo[tripId]) tripInfo[tripId].signalLost = false;
  renderSidebar();
});
</script>
</body>
</html>
