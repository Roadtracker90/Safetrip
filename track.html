<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suivi de trajet — Fretchain</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="/vendor/leaflet/leaflet.css" /></noscript>
<style>
  :root { --navy:#0b1f3a; --blue:#1e5ab8; --gold:#d4a72c; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; color:var(--navy); }
  header { background:var(--navy); color:#fff; padding:0.9rem 1.2rem; }
  header h1 { margin:0; font-size:1rem; }
  header p { margin:0.2rem 0 0; font-size:0.78rem; color:#c7d2e8; }
  #map { height: 60vh; width:100%; }
  #info { max-width:480px; margin: 0.9rem auto; padding: 0 1rem; }
  .card { background:#fff; border-radius:12px; padding:1rem 1.2rem; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card table { width:100%; font-size:0.9rem; border-collapse:collapse; }
  .card td { padding:0.3rem 0; vertical-align:top; }
  .card td:first-child { color:#5a6475; width:40%; }
  .banner { padding:0.7rem 1rem; border-radius:8px; font-size:0.85rem; margin-bottom:0.8rem; }
  .banner.live { background:#e7f7ec; color:#17643a; }
  .banner.ended { background:#fdecec; color:#8a1f1f; }
  .banner.wait { background:#eef4ff; color:#1e3a6b; }
  .disclaimer { font-size:0.75rem; color:#5a6475; text-align:center; margin: 0.6rem 1rem 1.4rem; }
</style>
</head>
<body style="background:#f4f6fa; margin:0;">
<header>
  <h1>Fretchain — Suivi de trajet</h1>
  <p>Lien de suivi partagé par le voyageur — lecture seule, ce trajet uniquement.</p>
</header>
<div id="map"></div>
<div id="info">
  <div id="banner" class="banner wait">En attente de données de position…</div>
  <div class="card" id="detailsCard" style="display:none;">
    <table id="detailsTable"></table>
  </div>
</div>
<div class="disclaimer">Cette page ne montre que le trajet pour lequel ce lien a été généré. Elle cesse de se mettre à jour dès que le voyageur arrête le partage.</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const params = new URLSearchParams(location.search);
const tripId = params.get('trip');
const banner = document.getElementById('banner');
const detailsCard = document.getElementById('detailsCard');
const detailsTable = document.getElementById('detailsTable');

let map = null;
try {
  if (typeof L === 'undefined') throw new Error('Leaflet non chargé');
  map = L.map('map').setView([3.848, 11.502], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
} catch (e) {
  // La carte n'a pas pu se charger (réseau lent/instable) : les
  // informations du trajet restent affichées normalement ci-dessous.
  document.getElementById('map').outerHTML =
    '<div style="padding:1rem; color:#5a6475; font-size:0.85rem; text-align:center;">' +
    'Carte indisponible (connexion lente ?) — les informations du trajet restent à jour ci-dessous.</div>';
}
let marker = null;

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

if (!tripId) {
  banner.className = 'banner ended';
  banner.textContent = "Lien invalide : aucun identifiant de trajet fourni.";
} else {
  const socket = io();
  let gotData = false;
  const diagnosticTimer = setTimeout(() => {
    if (!gotData) {
      banner.className = 'banner wait';
      banner.textContent = "Toujours en attente... la connexion semble lente (le serveur peut mettre jusqu'à une minute à répondre après une période d'inactivité). Patientez ou réessayez.";
    }
  }, 20000);

  socket.on('connect', () => socket.emit('track:join', { tripId }));
  socket.on('connect_error', () => {
    banner.className = 'banner wait';
    banner.textContent = 'Connexion au serveur en cours (ça peut prendre jusqu\'à une minute après une période d\'inactivité)…';
  });

  socket.on('track:error', () => {
    gotData = true;
    clearTimeout(diagnosticTimer);
    banner.className = 'banner ended';
    banner.textContent = "Ce trajet n'est plus disponible (terminé ou consentement retiré par le voyageur).";
  });

  socket.on('track:ended', () => {
    banner.className = 'banner ended';
    banner.textContent = 'Le voyageur a arrêté le partage. Dernière position connue affichée ci-dessus.';
  });

  socket.on('position:broadcast', (msg) => {
    gotData = true;
    clearTimeout(diagnosticTimer);
    const {
      travelerDisplayName, transportMode, agencyName, originLabel, destinationLabel,
      fareAmount, fareCurrency, vehiclePlate, seatNumber, scheduledDepartureAt, notes,
      lat, lng, recordedAt,
    } = msg;

    banner.className = 'banner live';
    banner.textContent = `Position en direct — mise à jour à ${new Date(recordedAt).toLocaleTimeString('fr-FR')}`;

    if (map) {
      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng]).addTo(map);
        map.setView([lat, lng], 12);
      }
    }

    const rows = [
      ['Voyageur', travelerDisplayName],
      ['Transport', `${transportMode || '—'}${agencyName ? ' (' + agencyName + ')' : ''}`],
      ['Trajet', `${originLabel || '?'} → ${destinationLabel || '?'}`],
    ];
    if (fareAmount != null) rows.push(['Coût payé', `${Number(fareAmount).toLocaleString('fr-FR')} ${fareCurrency || ''}`]);
    if (vehiclePlate) rows.push(['Véhicule', `${vehiclePlate}${seatNumber ? ' · siège ' + seatNumber : ''}`]);
    if (scheduledDepartureAt) rows.push(['Départ prévu', new Date(scheduledDepartureAt).toLocaleString('fr-FR')]);
    if (notes) rows.push(['Notes', notes]);

    detailsTable.innerHTML = rows.map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('');
    detailsCard.style.display = 'block';
  });
}
</script>
</body>
</html>
